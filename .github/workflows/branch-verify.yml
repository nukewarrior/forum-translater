name: Branch Verification
on:
  push:
    branches: [feat/multi-profile-openai-compatible]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: forum-translator-0.3.0-userscript
          path: |
            dist/forum-translator.user.js
            dist/forum-translator.user.js.build.json
          retention-days: 14
