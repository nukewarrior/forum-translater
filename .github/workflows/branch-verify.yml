name: Branch Verification
on:
  push:
    branches: [main, feat/multi-profile-openai-compatible, fix/x-native-layout, fix/reddit-feed-title-visibility]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: forum-translator-0.3.5-userscript
          path: |
            dist/forum-translator.user.js
            dist/forum-translator.user.js.build.json
          retention-days: 14
      - name: Publish verified userscript on main and approved feature branches
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'feat/multi-profile-openai-compatible' || github.ref_name == 'fix/x-native-layout' || github.ref_name == 'fix/reddit-feed-title-visibility')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stale CI runs must not overwrite a newer source commit's build.
          git fetch origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/$GITHUB_REF_NAME)" ]; then
            echo "Source branch moved while CI was running; skip stale artifact commit"
            exit 0
          fi
          git add main.js dist/forum-translator.user.js dist/forum-translator.user.js.build.json
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh verified userscript [skip ci]"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
